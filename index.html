<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanardağ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000000;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let hitboxes = [];
        let dpr = window.devicePixelRatio || 1;
        let logicalHeight = window.innerHeight; 

        const menuData = [
            { 
                title: "WEB SİTESİ", 
                url: "https://sites.google.com/view/yanardag-/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            },
            { 
                title: "OYUNLAR", 
                url: "https://sites.google.com/view/yanardag-games-com/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            }
        ];

        const img1 = new Image();
        const img2 = new Image();
        let img1Loaded = false;
        let img2Loaded = false;

        const bayrakExtensions = ['bayrak.png', 'bayrak.PNG', 'bayrak.jpg', 'bayrak.jpeg', 'Bayrak1.png'];
        let bayrakIndex = 0;

        img1.onload = () => { img1Loaded = true; resizeCanvas(); };
        img1.onerror = () => {
            bayrakIndex++;
            loadBayrak();
        };

        function loadBayrak() {
            if (bayrakIndex < bayrakExtensions.length) {
                img1.src = bayrakExtensions[bayrakIndex];
            }
        }

        const avatarExtensions = ['avatar.jpeg', 'avatar.jpg', 'avatar.png', 'avatar.JPEG', 'avatar.JPG', 'avatar.PNG'];
        let avatarIndex = 0;

        img2.onload = () => { img2Loaded = true; resizeCanvas(); };
        img2.onerror = () => {
            avatarIndex++;
            loadAvatar();
        };

        function loadAvatar() {
            if (avatarIndex < avatarExtensions.length) {
                img2.src = avatarExtensions[avatarIndex];
            }
        }

        loadBayrak();
        loadAvatar();

        const particles = [];
        const particleCount = 80;
        const fireColors = ['255, 69, 0', '255, 140, 0', '255, 215, 0'];

        function initParticles() {
            particles.length = 0;
            const width = window.innerWidth;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * logicalHeight,
                    radius: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.8,
                    speedY: Math.random() * -1.5 - 0.5,
                    opacity: Math.random() * 0.8 + 0.2,
                    color: fireColors[Math.floor(Math.random() * fireColors.length)]
                });
            }
        }

        function calculateContentHeight() {
            const width = window.innerWidth;
            let currentY = window.innerHeight > 800 ? 40 : 20;

            if (img1Loaded) {
                const maxWidth1 = Math.min(400, width * 0.8); // Büyütüldü
                const maxHeight1 = window.innerHeight * 0.30; 
                const scale1 = Math.min(maxWidth1 / img1.width, maxHeight1 / img1.height);
                currentY += (img1.height * scale1) + 20;
            }

            if (img2Loaded) {
                const maxWidth2 = Math.min(220, width * 0.5); // Büyütüldü
                const maxHeight2 = window.innerHeight * 0.25; 
                const scale2 = Math.min(maxWidth2 / img2.width, maxHeight2 / img2.height);
                currentY += (img2.height * scale2) + 35;
            }

            if (!img1Loaded && !img2Loaded) {
                currentY += 180;
            }

            currentY += 60; // Başlık boşluğu artırıldı
            currentY += 75; // Hoş geldiniz boşluğu artırıldı

            const btnHeight = width < 500 ? 70 : 90; // Buton yükseklikleri artırıldı
            currentY += menuData.length * (btnHeight + 35);
            
            currentY += 60; // Alt boşluk artırıldı

            return Math.max(window.innerHeight, currentY);
        }

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            const width = window.innerWidth;
            
            logicalHeight = calculateContentHeight();

            canvas.width = width * dpr;
            canvas.height = logicalHeight * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = logicalHeight + 'px';

            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            initParticles();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function draw() {
            const width = window.innerWidth;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, logicalHeight);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) {
                    p.y = logicalHeight;
                    p.x = Math.random() * width;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`; 
                ctx.fill();
            });

            const centerX = width / 2;
            let currentY = window.innerHeight > 800 ? 40 : 20;

            if (img1Loaded) {
                const maxWidth1 = Math.min(400, width * 0.8);
                const maxHeight1 = window.innerHeight * 0.30; 
                const scale1 = Math.min(maxWidth1 / img1.width, maxHeight1 / img1.height);
                const w1 = img1.width * scale1;
                const h1 = img1.height * scale1;
                ctx.drawImage(img1, centerX - w1 / 2, currentY, w1, h1);
                currentY += h1 + 20;
            }

            if (img2Loaded) {
                const maxWidth2 = Math.min(220, width * 0.5);
                const maxHeight2 = window.innerHeight * 0.25; 
                const scale2 = Math.min(maxWidth2 / img2.width, maxHeight2 / img2.height);
                const w2 = img2.width * scale2;
                const h2 = img2.height * scale2;
                ctx.drawImage(img2, centerX - w2 / 2, currentY, w2, h2);
                currentY += h2 + 35;
            }

            if (!img1Loaded && !img2Loaded) {
                currentY += 180;
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Yazılar Büyütüldü
            ctx.fillStyle = '#FFFFFF';
            if ('letterSpacing' in ctx) ctx.letterSpacing = "4px";
            ctx.font = width < 500 ? 'bold 34px Arial, sans-serif' : 'bold 54px Arial, sans-serif';
            ctx.fillText('YANARDAĞ', centerX, currentY);
            if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
            
            currentY += 60;

            ctx.font = width < 500 ? '28px Arial, sans-serif' : '42px Arial, sans-serif';
            ctx.fillText('Hoş geldiniz', centerX, currentY);

            currentY += 75;

            menuData.forEach((item, index) => {
                if (item.isHovered) {
                    item.scale = Math.min(item.scale + 0.02, 1.08); 
                    item.animProgress = Math.min(item.animProgress + 0.1, 1);
                } else {
                    item.scale = Math.max(item.scale - 0.02, 1.0);
                    item.animProgress = Math.max(item.animProgress - 0.1, 0);
                }

                // Buton Yazıları Büyütüldü
                ctx.font = width < 500 ? 'bold 24px Arial, sans-serif' : 'bold 32px Arial, sans-serif';
                
                const textWidth = ctx.measureText(item.title).width;
                const btnWidth = textWidth + 120; // Genişlik artırıldı
                const btnHeight = width < 500 ? 70 : 90; // Yükseklik artırıldı

                ctx.save();
                ctx.translate(centerX, currentY);
                ctx.scale(item.scale, item.scale);

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight, 22); // Köşe yumuşatması artırıldı
                } else {
                    ctx.rect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight);
                }

                ctx.fillStyle = `rgba(255, 69, 0, ${item.animProgress * 0.15})`;
                ctx.fill();
                
                ctx.lineWidth = 4; // Çizgi kalınlığı artırıldı
                ctx.strokeStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                ctx.stroke();

                ctx.fillStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                if ('letterSpacing' in ctx) ctx.letterSpacing = "3px";
                ctx.fillText(item.title, 0, 0);
                if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
                
                ctx.restore();

                hitboxes[index] = {
                    x: centerX - btnWidth / 2,
                    y: currentY - btnHeight / 2,
                    width: btnWidth,
                    height: btnHeight,
                    url: item.url
                };

                currentY += btnHeight + 35; // Butonlar arası boşluk artırıldı
            });

            requestAnimationFrame(draw);
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const touch = evt.touches && evt.touches[0] ? evt.touches[0] : (evt.changedTouches ? evt.changedTouches[0] : null);
            const clientX = touch ? touch.clientX : evt.clientX;
            const clientY = touch ? touch.clientY : evt.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleClick(evt) {
            const pos = getMousePos(evt);
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    window.open(box.url, '_blank');
                    break;
                }
            }
        }

        function handleMouseMove(evt) {
            const pos = getMousePos(evt);
            let anyHovered = false;
            
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    menuData[i].isHovered = true;
                    anyHovered = true;
                } else {
                    menuData[i].isHovered = false;
                }
            }
            
            canvas.style.cursor = anyHovered ? 'pointer' : 'default';
        }

        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('mousemove', handleMouseMove);

        draw();
    </script>
</body>
</html>
