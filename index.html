<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanard n   ağ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            background-color: #000000;
            touch-action: none;
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let hitboxes = [];

        const menuData = [
            { 
                title: "WEB SİTESİ", 
                url: "https://sites.google.com/view/yanardag-/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            },
            { 
                title: "OYUNLAR", 
                url: "https://sites.google.com/view/yanardag-games-com/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            }
        ];

        const img1 = new Image();
        const img2 = new Image();
        let img1Loaded = false;
        let img2Loaded = false;

        const bayrakExtensions = ['bayrak.png', 'bayrak.PNG', 'bayrak.jpg', 'bayrak.jpeg', 'Bayrak1.png'];
        let bayrakIndex = 0;

        img1.onload = () => { img1Loaded = true; };
        img1.onerror = () => {
            bayrakIndex++;
            loadBayrak();
        };

        function loadBayrak() {
            if (bayrakIndex < bayrakExtensions.length) {
                img1.src = bayrakExtensions[bayrakIndex];
            }
        }

        const avatarExtensions = ['avatar.jpeg', 'avatar.jpg', 'avatar.png', 'avatar.JPEG', 'avatar.JPG', 'avatar.PNG'];
        let avatarIndex = 0;

        img2.onload = () => { img2Loaded = true; };
        img2.onerror = () => {
            avatarIndex++;
            loadAvatar();
        };

        function loadAvatar() {
            if (avatarIndex < avatarExtensions.length) {
                img2.src = avatarExtensions[avatarIndex];
            }
        }

        loadBayrak();
        loadAvatar();

        const particles = [];
        const particleCount = 80;
        const fireColors = ['255, 69, 0', '255, 140, 0', '255, 215, 0'];

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                const randomColor = fireColors[Math.floor(Math.random() * fireColors.length)];
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.8,
                    speedY: Math.random() * -1.5 - 0.5,
                    opacity: Math.random() * 0.8 + 0.2,
                    color: randomColor
                });
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function draw() {
            if (img1.complete && img1.naturalWidth !== 0) img1Loaded = true;
            if (img2.complete && img2.naturalWidth !== 0) img2Loaded = true;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`; 
                ctx.fill();
            });

            const centerX = canvas.width / 2;
            let currentY = canvas.height > 800 ? 30 : 15;

            if (img1Loaded) {
                const maxWidth1 = Math.min(320, canvas.width * 0.7);
                const scale1 = maxWidth1 / img1.width;
                const w1 = maxWidth1;
                const h1 = img1.height * scale1;
                ctx.drawImage(img1, centerX - w1 / 2, currentY, w1, h1);
                currentY += h1 + 15;
            }

            if (img2Loaded) {
                const maxWidth2 = Math.min(170, canvas.width * 0.4);
                const scale2 = maxWidth2 / img2.width;
                const w2 = maxWidth2;
                const h2 = img2.height * scale2;
                ctx.drawImage(img2, centerX - w2 / 2, currentY, w2, h2);
                currentY += h2 + 25;
            }

            if (!img1Loaded && !img2Loaded) {
                currentY += 200;
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#FFFFFF';
            if ('letterSpacing' in ctx) ctx.letterSpacing = "4px";
            ctx.font = 'bold 44px Arial, sans-serif';
            if(canvas.width < 500) ctx.font = 'bold 28px Arial, sans-serif';
            ctx.fillText('YANARDAĞ BAĞLANTILARI', centerX, currentY);
            if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
            
            currentY += 50;

            ctx.font = '34px Arial, sans-serif';
            if(canvas.width < 500) ctx.font = '24px Arial, sans-serif';
            ctx.fillText('Hoş geldiniz', centerX, currentY);

            currentY += 65;

            menuData.forEach((item, index) => {
                if (item.isHovered) {
                    item.scale = Math.min(item.scale + 0.02, 1.08); 
                    item.animProgress = Math.min(item.animProgress + 0.1, 1);
                } else {
                    item.scale = Math.max(item.scale - 0.02, 1.0);
                    item.animProgress = Math.max(item.animProgress - 0.1, 0);
                }

                ctx.font = 'bold 26px Arial, sans-serif';
                if(canvas.width < 500) ctx.font = 'bold 20px Arial, sans-serif';
                
                const textWidth = ctx.measureText(item.title).width;
                const btnWidth = textWidth + 100;
                const btnHeight = canvas.width < 500 ? 55 : 70;

                ctx.save();
                ctx.translate(centerX, currentY);
                ctx.scale(item.scale, item.scale);

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight, 18);
                } else {
                    ctx.rect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight);
                }

                ctx.fillStyle = `rgba(255, 69, 0, ${item.animProgress * 0.15})`;
                ctx.fill();
                
                ctx.lineWidth = 3;
                ctx.strokeStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                ctx.stroke();

                ctx.fillStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                if ('letterSpacing' in ctx) ctx.letterSpacing = "3px";
                ctx.fillText(item.title, 0, 0);
                if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
                
                ctx.restore();

                hitboxes[index] = {
                    x: centerX - btnWidth / 2,
                    y: currentY - btnHeight / 2,
                    width: btnWidth,
                    height: btnHeight,
                    url: item.url
                };

                currentY += btnHeight + 25;
            });

            requestAnimationFrame(draw);
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleClick(evt) {
            const pos = getMousePos(evt);
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    window.open(box.url, '_blank');
                    break;
                }
            }
        }

        function handleMouseMove(evt) {
            const pos = getMousePos(evt);
            let anyHovered = false;
            
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    menuData[i].isHovered = true;
                    anyHovered = true;
                } else {
                    menuData[i].isHovered = false;
                }
            }
            
            canvas.style.cursor = anyHovered ? 'pointer' : 'default';
        }

        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('mousemove', handleMouseMove);
        
        canvas.addEventListener('touchstart', (e) => {
            handleMouseMove(e);
        }, {passive: true});
        
        canvas.addEventListener('touchend', (e) => {
            handleClick(e.changedTouches ? e.changedTouches[0] : e);
        });

        draw();
    </script>
</body>
</html>
