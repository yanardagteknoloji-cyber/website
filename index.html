<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanardağ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            background-color: #000000;
            touch-action: none;
        }
    </style>
</head>
<body>

    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let hitboxes = [];

        // Menü Verileri
        const menuData = [
            { 
                title: "WEB SİTESİ", 
                url: "https://sites.google.com/view/yanardag-/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            },
            { 
                title: "OYUNLAR", 
                url: "https://sites.google.com/view/yanardag-games-com/ana-sayfa",
                isHovered: false,
                scale: 1,
                animProgress: 0
            }
        ];

        // Görseller
        const img1 = new Image();
        const img2 = new Image();
        let img1Loaded = false;
        let img2Loaded = false;

        img1.src = 'bayrak.png';
        img2.src = 'avatar.jpg';

        img1.onload = () => { img1Loaded = true; };
        img2.onload = () => { img2Loaded = true; };

        // Arka Plan Parçacıkları (Ateş Kıvılcımları)
        const particles = [];
        const particleCount = 80;

        // Ateş tonları (Sarı, Turuncu, Kırmızı)
        const fireColors = ['255, 69, 0', '255, 140, 0', '255, 215, 0'];

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                const randomColor = fireColors[Math.floor(Math.random() * fireColors.length)];
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.8,
                    speedY: Math.random() * -1.5 - 0.5, // Ateşin savrulma hızı
                    opacity: Math.random() * 0.8 + 0.2,
                    color: randomColor
                });
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Ana Çizim Döngüsü
        function draw() {
            // Ekranı temizle
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Kıvılcım Animasyonu Çiz
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) {
                    p.y = canvas.height;
                    p.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, ${p.opacity})`; 
                ctx.fill();
            });

            const centerX = canvas.width / 2;
            let currentY = canvas.height > 800 ? 80 : 40;

            // Fotoğrafları Çiz
            if (img1Loaded || img2Loaded) {
                const gap = 20;
                const maxWidth = Math.min(140, canvas.width * 0.35);
                
                let w1 = 0, h1 = 0, w2 = 0, h2 = 0;
                let totalWidth = 0;
                
                if (img1Loaded) {
                    const scale1 = maxWidth / img1.width;
                    w1 = maxWidth;
                    h1 = img1.height * scale1;
                    totalWidth += w1;
                }
                
                if (img2Loaded) {
                    const scale2 = maxWidth / img2.width;
                    w2 = maxWidth;
                    h2 = img2.height * scale2;
                    totalWidth += w2;
                }
                
                if (img1Loaded && img2Loaded) totalWidth += gap;

                let startX = centerX - (totalWidth / 2);
                let maxImgHeight = Math.max(h1, h2);

                if (img1Loaded) {
                    ctx.drawImage(img1, startX, currentY + (maxImgHeight - h1) / 2, w1, h1);
                    startX += w1 + gap;
                }
                
                if (img2Loaded) {
                    ctx.drawImage(img2, startX, currentY + (maxImgHeight - h2) / 2, w2, h2);
                }
                
                currentY += maxImgHeight + 35;
            } else {
                currentY += 180;
            }

            // Başlıkları Çiz
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillStyle = '#FFFFFF';
            if ('letterSpacing' in ctx) ctx.letterSpacing = "3px";
            ctx.font = 'bold 32px Arial, sans-serif';
            if(canvas.width < 500) ctx.font = 'bold 24px Arial, sans-serif';
            ctx.fillText('YANARDAĞ', centerX, currentY);
            if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
            
            currentY += 45;

            ctx.font = '28px Arial, sans-serif';
            if(canvas.width < 500) ctx.font = '20px Arial, sans-serif';
            ctx.fillText('Hoş geldiniz', centerX, currentY);

            currentY += 70;

            // Animasyonlu Butonları Çiz
            menuData.forEach((item, index) => {
                if (item.isHovered) {
                    item.scale = Math.min(item.scale + 0.02, 1.08); 
                    item.animProgress = Math.min(item.animProgress + 0.1, 1);
                } else {
                    item.scale = Math.max(item.scale - 0.02, 1.0);
                    item.animProgress = Math.max(item.animProgress - 0.1, 0);
                }

                ctx.font = 'bold 20px Arial, sans-serif';
                if(canvas.width < 500) ctx.font = 'bold 16px Arial, sans-serif';
                
                const textWidth = ctx.measureText(item.title).width;
                const btnWidth = textWidth + 80;
                const btnHeight = canvas.width < 500 ? 45 : 55;

                ctx.save();
                ctx.translate(centerX, currentY);
                ctx.scale(item.scale, item.scale);

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight, 15);
                } else {
                    ctx.rect(-btnWidth / 2, -btnHeight / 2, btnWidth, btnHeight);
                }

                // Butonun hover rengini de temaya uygun ateşe yakın bir renk (koyu kırmızı) yapalım
                ctx.fillStyle = `rgba(255, 69, 0, ${item.animProgress * 0.15})`;
                ctx.fill();
                
                // Kenarlık turuncu/kırmızı tonda parlar
                ctx.lineWidth = 2;
                ctx.strokeStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                ctx.stroke();

                ctx.fillStyle = item.animProgress > 0.5 ? '#ff4500' : '#ffffff';
                if ('letterSpacing' in ctx) ctx.letterSpacing = "2px";
                ctx.fillText(item.title, 0, 0);
                if ('letterSpacing' in ctx) ctx.letterSpacing = "0px";
                
                ctx.restore();

                hitboxes[index] = {
                    x: centerX - btnWidth / 2,
                    y: currentY - btnHeight / 2,
                    width: btnWidth,
                    height: btnHeight,
                    url: item.url
                };

                currentY += btnHeight + 25;
            });

            requestAnimationFrame(draw);
        }

        // Fare/Dokunmatik Etkileşimleri
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleClick(evt) {
            const pos = getMousePos(evt);
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    window.open(box.url, '_blank');
                    break;
                }
            }
        }

        function handleMouseMove(evt) {
            const pos = getMousePos(evt);
            let anyHovered = false;
            
            for (let i = 0; i < hitboxes.length; i++) {
                const box = hitboxes[i];
                if (box && pos.x >= box.x && pos.x <= box.x + box.width &&
                    pos.y >= box.y && pos.y <= box.y + box.height) {
                    menuData[i].isHovered = true;
                    anyHovered = true;
                } else {
                    menuData[i].isHovered = false;
                }
            }
            
            canvas.style.cursor = anyHovered ? 'pointer' : 'default';
        }

        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('mousemove', handleMouseMove);
        
        canvas.addEventListener('touchstart', (e) => {
            handleMouseMove(e);
        }, {passive: true});
        
        canvas.addEventListener('touchend', (e) => {
            handleClick(e.changedTouches ? e.changedTouches[0] : e);
        });

        draw();
    </script>
</body>
</html>
